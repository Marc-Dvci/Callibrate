name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - name: lint
        run: uv run ruff check .
      - name: tests
        run: uv run pytest -q
      - name: evidence evaluation
        run: uv run python evals/run_evaluation.py
